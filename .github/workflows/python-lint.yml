name: Python Data Validation

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 data/ --count --statistics --max-line-length=120 --extend-ignore=E203