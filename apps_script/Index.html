  <!-- ===========================================================================
  SPA ORCHESTRATOR SCRIPT
  ========================================================================== -->
  <script>
    window.App = (function() {
      const views = ['dashboard', 'simulator', 'detailed'];
      let currentView = null;
      let isSystemDegraded = false;

      function triggerErrorBoundary(error) {
        console.error('[Vetor] Critical System Failure:', error);
        isSystemDegraded = true;
        
        // Hide all views and tabs
        document.querySelectorAll('.view-section').forEach(s => {
          s.classList.add('hidden');
          s.classList.remove('block', 'active');
        });
        document.querySelectorAll('nav button').forEach(b => b.classList.add('opacity-50', 'pointer-events-none'));
        document.getElementById('global-badge-container')?.classList.add('hidden');
        
        // Show Fallback UI
        const errorState = document.getElementById('global-error-state');
        if (errorState) {
          errorState.classList.remove('hidden');
          errorState.classList.add('flex');
        }
      }

      function navigateTo(viewName) {
        if (isSystemDegraded || !views.includes(viewName) || viewName === currentView) return;

        try {
          // 1. Update tab styling
          document.querySelectorAll('nav button').forEach(btn => {
            btn.classList.remove('text-[#5c6b89]', 'bg-[#f0f2f5]');
            btn.classList.add('text-[#8c8c8c]');
            btn.removeAttribute('aria-current');
          });
          const activeTab = document.getElementById(`tab-${viewName}`);
          if (activeTab) {
            activeTab.classList.remove('text-[#8c8c8c]');
            activeTab.classList.add('text-[#5c6b89]', 'bg-[#f0f2f5]');
            activeTab.setAttribute('aria-current', 'page');
          }

          // 2. Manage View Visibility
          document.querySelectorAll('.view-section').forEach(section => {
            section.classList.add('hidden');
            section.classList.remove('block', 'active');
          });
          const target = document.getElementById(`${viewName}-view`);
          if (target) {
            target.classList.remove('hidden');
            target.classList.add('block', 'active');
          } else {
            throw new Error(`DOM node for view '${viewName}' not found.`);
          }

          // 3. Mount Controllers
          if (viewName === 'dashboard' && window.DashboardController) {
            window.DashboardController.init();
          } else if (viewName === 'simulator' && window.SimulatorController) {
            window.SimulatorController.loadSimulation();
          } else if (viewName === 'detailed' && window.DetailedController) {
            window.DetailedController.loadData();
          } else {
            throw new Error(`Controller mapping for '${viewName}' is missing or undefined.`);
          }

          currentView = viewName;
          
        } catch (error) {
          triggerErrorBoundary(error);
        }
      }

      function updateGlobalBadge(text) {
        const badge = document.getElementById('global-scenario-badge');
        if (badge) badge.textContent = text;
      }

      function refreshAll() {
        if (isSystemDegraded) return;
        try {
          if (window.DashboardController) window.DashboardController.init();
          if (window.SimulatorController) window.SimulatorController.loadSimulation();
          if (window.DetailedController) window.DetailedController.loadData();
        } catch (error) {
          triggerErrorBoundary(error);
        }
      }

      function init() {
        try {
          document.querySelectorAll('.view-section').forEach(section => {
            if (section.id !== 'dashboard-view') section.classList.add('hidden');
          });
          navigateTo('dashboard');
        } catch (error) {
          triggerErrorBoundary(error);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      return { navigateTo, refreshAll, updateGlobalBadge };
    })();
  </script>

</body>
